<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09100d" />
    <meta
      name="description"
      content="A disposable visual spike for an editorial, liquid emotion orbit."
    />
    <title>Emotion Orbit — Liquid Study</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="experience" data-emotion="wonder">
      <canvas id="fluid-canvas" aria-hidden="true"></canvas>

      <header class="topbar">
        <a class="brand" href="#experience" aria-label="Emotion Orbit home">emotion orbit</a>
        <nav class="languages" aria-label="Language">
          <button type="button" aria-pressed="true">EN</button>
          <button type="button" aria-pressed="false">VN</button>
          <button type="button" aria-pressed="false">中文</button>
        </nav>
        <p class="study-mark">liquid field study / 001</p>
      </header>

      <main id="experience" class="hero">
        <div class="composition-note" aria-hidden="true">
          <span>01</span>
          <span>feeling made visible</span>
        </div>

        <form class="feeling-form" id="feeling-form">
          <label for="feeling-input">What is moving through you?</label>
          <div class="input-row">
            <textarea
              id="feeling-input"
              name="feeling"
              rows="1"
              maxlength="240"
              placeholder="Type a feeling…"
              autocomplete="off"
            ></textarea>
            <button class="send-button" type="submit">
              <span>Send</span>
              <span aria-hidden="true">↗</span>
            </button>
          </div>
          <p class="field-status" id="field-status" role="status" aria-live="polite">
            Wonder is holding the field.
          </p>
        </form>
      </main>

      <footer class="emotion-footer">
        <nav class="emotion-list" aria-label="Emotional fields">
          <button type="button" data-emotion="joy"><span>01</span> Joy</button>
          <button type="button" data-emotion="calm"><span>02</span> Calm</button>
          <button type="button" data-emotion="love"><span>03</span> Love</button>
          <button type="button" data-emotion="wonder" aria-current="true"><span>04</span> Wonder</button>
          <button type="button" data-emotion="anger"><span>05</span> Anger</button>
          <button type="button" data-emotion="melancholy"><span>06</span> Melancholy</button>
        </nav>
        <p class="orbit-hint">drag / orbit</p>
      </footer>

      <div class="debug-readout" id="debug-readout" hidden></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
